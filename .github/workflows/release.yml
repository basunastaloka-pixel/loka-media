name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag must use a numeric version such as v1.0.8." >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "number=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Build split release APKs
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.number }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Loka Media ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: Loka Media update - bug fixes and improvements.
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          fail_on_unmatched_files: true
