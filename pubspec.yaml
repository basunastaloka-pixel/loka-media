name: pilah_foto
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.11+11

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Local Media, File Picker & Permissions
  permission_handler: ^11.3.1
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: any

  # Google Drive Integration & Auth
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  googleapis: ^13.1.0
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

  # Utilities & Storage
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  http: ^1.2.1

  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.5.5 fixes JNI registration and deregistration across multiple Flutter engines.
  shared_preferences_android: 2.5.5

flutter:
  uses-material-design: true
